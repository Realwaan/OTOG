# OTOG E-Wallet Runtime Configuration
# Override any key via Java system property -Dotog.<key>=<value>
# or supply a custom file path via -Dotog.config.file=<path>

# --- Database ---
db.path=data/otog.db
db.busy.timeout.ms=5000

# --- Currency & Money ---
currency.default=PHP
money.scale=2

# --- Authentication, PIN & Session ---
auth.max.failed.attempts=5
auth.min.password.length=6
auth.mobile.regex=^09[0-9]{9}$
auth.pin.min.length=4
auth.pin.max.length=6
auth.pin.max.attempts=3
session.inactivity.minutes=15
session.poll.interval.ms=15000

# --- OTP (Two-Factor Authentication) ---
otp.expiry.minutes=5
otp.resend.cooldown.seconds=60
otp.max.attempts=5
otp.length=6

# --- Transactions, Limits & Fee Policy ---
send.min.amount=1.00
send.max.amount=50000.00
send.default.fee.flat=0.00
send.default.fee.percent=0.00
send.min.recipient.length=10
investment.default.return.rate=0.05
investment.product.code=OTOG-SIM-FUND
investment.product.name=OTOG Simulated Balanced Fund
investment.simulated.unit.price=100.00
# --- Simulated Loan Product (CAP-12) ---
# Interest = principal * monthlyRate * termMonths; ProcessingFee = flat + principal * percent; Total = principal + interest + processingFee
loan.product.code=OTOG-SIM-LOAN
loan.product.name=OTOG Simulated Quick Cash Loan
loan.min.principal=500.00
loan.max.principal=10000.00
loan.monthly.interest.rate=0.03
loan.term.months=3
loan.processing.fee.flat=25.00
loan.processing.fee.percent=0.01
dashboard.recent.transaction.limit=50

# --- Channels & Seeded Demo Data ---
cash.operations=CASH_IN,CASH_OUT
cash.channels=GCash,Maya,BDO,BPI,7-Eleven OTC
bills.seeded=Meralco (Electricity),Manila Water (Water),Maynilad (Water),PLDT (Telecom & Internet),Globe Telecom (Mobile & Broadband)
bills.demo.accounts=Meralco (Electricity)|MERALCO-10023456|1250.00;Manila Water (Water)|MWATER-20034567|485.50;Maynilad (Water)|MAYNILAD-30045678|520.00;PLDT (Telecom & Internet)|PLDT-40056789|1699.00;Globe Telecom (Mobile & Broadband)|GLOBE-50067890|999.00
bills.default.fee.flat=0.00
bills.default.fee.percent=0.00
demo.payment.methods=BDO|BDO Unibank|BDO Demo|\u2022\u2022\u2022\u2022 1234|true;BPI|Bank of the Philippine Islands (BPI)|BPI Demo|\u2022\u2022\u2022\u2022 5678|false;METRO|Metrobank|Metrobank Demo|\u2022\u2022\u2022\u2022 9012|false

# --- Default Administrator Account Seed ---
admin.seed.enabled=true
admin.user.id=USR-ADMIN-01
admin.wallet.id=WLT-ADMIN-01
admin.username=admin
admin.mobile=09000000000
admin.email=admin@otog.ph
admin.password=password
admin.pin=123456
admin.initial.balance=1000.00

# --- Default Merchant Account Seed ---
merchant.seed.enabled=true
merchant.user.id=USR-MERCHANT-01
merchant.wallet.id=WLT-MERCHANT-01
merchant.username=OTOG Merchant Store
merchant.mobile=09178888888
merchant.email=merchant@otog.ph
merchant.password=Merchant123!
merchant.pin=8888
merchant.initial.balance=0.00

# --- Deterministic Demo User Accounts Seed ---
# Format per entry: userId|walletId|name|mobile|email|password|pin|role|initialBalance
demo.users.seed.enabled=true
demo.users=USR-DEMO-01|WLT-DEMO-01|Demo Sender|09000000101|demo.sender@otog.ph|DemoPass123!|1234|USER|5000.00;USR-DEMO-02|WLT-DEMO-02|Demo Recipient|09000000102|demo.recipient@otog.ph|DemoPass123!|5678|USER|1500.00

# --- UI Dimensions & Theme Tokens ---
ui.app.title=OTOG E-Wallet
ui.font.family=SansSerif
ui.font.mono=Monospaced
ui.login.width=750
ui.login.height=420
ui.dashboard.width=1020
ui.dashboard.height=680
ui.dashboard.min.width=720
ui.dashboard.min.height=520
ui.register.width=480
ui.register.height=350
ui.pin.width=440
ui.pin.height=290
ui.notifications.width=720
ui.notifications.height=480
ui.receipt.width=460
ui.receipt.height=360
ui.table.row.height=24
ui.color.muted=#5A626E
ui.color.success=#116644
ui.color.error=#B02626
ui.color.warning=#B45F0A
ui.color.info=#46505F
ui.color.primary=#2D5A8C
ui.color.border=#D7DCE2

# --- File Handling & Formatting ---
file.statement.default.name=otog-statement.txt
file.receipt.prefix=receipt-
file.timestamp.pattern=yyyy-MM-dd HH:mm:ss
ui.date.pattern=yyyy-MM-dd HH:mm
